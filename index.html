<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B1A3A">
<title>PGY TRM 西醫指導教師評核表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1A3A;
  --navy-2:#14275A;
  --orange:#F39220;
  --orange-soft:#FDF0DC;
  --bg:#F4F6FA;
  --card:#FFFFFF;
  --line:#DFE4ED;
  --text:#1B2436;
  --muted:#6B7689;
  --yes:#0E7C5A;
  --yes-soft:#E6F4EF;
  --no:#B4472E;
  --no-soft:#FBEDE9;
  --radius:14px;
  --shadow:0 2px 10px rgba(11,26,58,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei","微軟正黑體",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:16px;line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;}

/* ── 頂部 ── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
  box-shadow:0 2px 12px rgba(11,26,58,.25);
}
.topbar .eyebrow{
  font-size:11px;letter-spacing:.18em;color:var(--orange);
  font-weight:700;margin:0 0 2px;
}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.01em;}
.topbar .case{font-size:12.5px;color:#B9C4DA;margin-top:2px;}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;}
.meter .bar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;}
.meter .fill{height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .25s ease;}
.meter .num{font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* ── 版面 ── */
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 130px;}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);
  background:#fff;
}
.card-head .tag{
  width:6px;height:22px;border-radius:99px;background:var(--orange);flex:none;
}
.card-head h2{font-size:15px;margin:0;font-weight:700;flex:1;}
.count{
  font-size:12px;font-weight:700;color:var(--muted);
  background:var(--bg);border-radius:99px;padding:3px 10px;
  font-variant-numeric:tabular-nums;
}
.count.done{background:var(--orange-soft);color:#9A5A06;}

/* ── 基本資料 ── */
.fields{padding:12px 14px 14px;display:grid;gap:12px;}
@media(min-width:560px){.fields{grid-template-columns:1fr 1fr;}.fields .full{grid-column:1/-1;}}
label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px;}
label .req{color:var(--orange);margin-left:2px;}
input[type=text],input[type=date],select,textarea{
  width:100%;padding:11px 12px;font-size:16px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);
  font-family:inherit;
}
textarea{min-height:80px;resize:vertical;line-height:1.6;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(243,146,32,.16);}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}

/* ── 題目 ── */
.item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-top:1px solid #EFF2F7;
}
.item:first-child{border-top:none;}
.item.unanswered{background:#FFF7F4;}
.item .q{flex:1;font-size:14.5px;line-height:1.5;}
.item .q .no{
  font-size:11px;font-weight:700;color:var(--muted);
  display:block;letter-spacing:.06em;
}
.seg{display:flex;gap:6px;flex:none;}
.seg button{
  min-width:56px;min-height:44px;padding:0 12px;
  border:1.5px solid var(--line);background:#fff;color:var(--muted);
  border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .08s ease,background .15s,border-color .15s,color .15s;
}
.seg button:active{transform:scale(.94);}
.seg button.on-yes{background:var(--yes-soft);border-color:var(--yes);color:var(--yes);}
.seg button.on-no{background:var(--no-soft);border-color:var(--no);color:var(--no);}
.seg button:focus-visible{outline:3px solid rgba(243,146,32,.5);outline-offset:2px;}

.sec-actions{padding:8px 14px 12px;border-top:1px solid #EFF2F7;}
.linkbtn{
  background:none;border:none;color:var(--navy);font-size:13px;font-weight:700;
  padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}

/* ── 底部送出 ── */
.footbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}
.footinner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.footinner .stat{font-size:13px;color:var(--muted);line-height:1.35;flex:1;}
.footinner .stat b{color:var(--navy);font-size:15px;font-variant-numeric:tabular-nums;}
.primary{
  min-height:50px;padding:0 26px;border:none;border-radius:12px;
  background:var(--orange);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 10px rgba(243,146,32,.35);
}
.primary:disabled{background:#C8CEDA;box-shadow:none;cursor:not-allowed;}
.primary:active:not(:disabled){transform:translateY(1px);}

/* ── 提示 ── */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:var(--navy);color:#fff;font-size:14px;font-weight:500;
  padding:11px 18px;border-radius:99px;box-shadow:0 6px 20px rgba(11,26,58,.3);
  opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ── 完成畫面 ── */
.done-screen{display:none;padding:26px 12px 60px;max-width:620px;margin:0 auto;}
.done-screen.show{display:block;}
.done-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);}
.done-hero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;padding:26px 20px;text-align:center;}
.done-hero .tick{
  width:52px;height:52px;border-radius:50%;background:var(--orange);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  font-size:26px;color:#fff;font-weight:700;
}
.done-hero h2{margin:0 0 4px;font-size:19px;}
.done-hero p{margin:0;font-size:13px;color:#B9C4DA;}
.score{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:20px 0 6px;}
.score .n{font-size:46px;font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;}
.score .d{font-size:17px;color:var(--muted);font-weight:700;}
.score-label{text-align:center;font-size:13px;color:var(--muted);padding-bottom:14px;}
.bars{padding:0 18px 18px;}
.brow{margin-bottom:12px;}
.brow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.brow .t b{font-variant-numeric:tabular-nums;color:var(--navy);}
.brow .track{height:8px;border-radius:99px;background:#EDF0F6;overflow:hidden;}
.brow .val{height:100%;border-radius:99px;background:var(--orange);}
.done-actions{padding:0 18px 22px;display:grid;gap:10px;}
.done-actions a{display:flex;align-items:center;justify-content:center;text-decoration:none;}
.done-actions .pdf-action[hidden]{display:none;}
.ghost{
  min-height:48px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
}

.demo-note{
  margin:0 auto 12px;max-width:736px;background:var(--orange-soft);border:1px solid #F0D2A4;
  color:#8A5206;font-size:12.5px;padding:9px 12px;border-radius:10px;display:none;
}
.demo-note.show{display:block;}
.err-note{
  margin:0 auto 12px;max-width:736px;background:var(--no-soft);border:1px solid #E8B6A8;
  color:#8C3620;font-size:13px;line-height:1.55;padding:11px 13px;border-radius:10px;display:none;
}
.err-note.show{display:block;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <p class="eyebrow">PGY TRM 團隊資源管理訓練</p>
  <h1>西醫指導教師評核表</h1>
  <div class="case">情境教案：Pneumothorax with Respiratory Failure</div>
  <div class="meter">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="num" id="meterNum">0 / 25</div>
  </div>
</div>

<div id="formScreen">
<div class="wrap">

  <div class="demo-note" id="demoNote">預覽模式：若要正式寫入資料，請確認下方 GAS 網址已設定正確。</div>
  <div class="err-note" id="errBox"></div>

  <!-- 基本資料 -->
  <section class="card">
    <div class="card-head"><span class="tag"></span><h2>評核基本資料</h2></div>
    <div class="fields">
      <div>
        <label for="f_date">評核日期<span class="req">*</span></label>
        <input type="date" id="f_date">
      </div>
      <div>
        <label for="f_student">受評學員<span class="req">*</span></label>
        <input type="text" id="f_student" value="PGY2" autocomplete="off">
        <div class="hint">預設帶入 PGY2，如需改為個別姓名可直接修改。</div>
      </div>
      <div class="full">
        <label for="f_teacher">指導教師<span class="req">*</span></label>
        <select id="f_teacher">
          <option value="">請選擇指導教師</option>
          <option value="葉正發">葉正發</option>
          <option value="王淑慎">王淑慎</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
  </section>

  <!-- 題目容器 -->
  <div id="sections"></div>

  <!-- 質性回饋 -->
  <section class="card">
    <div class="card-head"><span class="tag"></span><h2>質性回饋</h2></div>
    <div class="fields">
      <div class="full">
        <label for="f_strength">表現良好之處</label>
        <textarea id="f_strength" placeholder="例：能於發現張力性氣胸後立即 call-out 並指派人員準備針刺減壓。"></textarea>
      </div>
      <div class="full">
        <label for="f_suggest">建議改善事項</label>
        <textarea id="f_suggest" placeholder="例：插管後未依序聽診確認位置，建議加強確認流程。"></textarea>
      </div>
    </div>
  </section>

</div>
</div>

<!-- 完成畫面 -->
<div class="done-screen" id="doneScreen">
  <div class="done-card">
    <div class="done-hero">
      <div class="tick">✓</div>
      <h2>評核已送出</h2>
      <p id="doneMeta"></p>
    </div>
    <div class="score"><span class="n" id="doneScore">0</span><span class="d">／ 25 項通過</span></div>
    <div class="score-label" id="donePct"></div>
    <div class="bars" id="doneBars"></div>
    <div class="done-actions">
      <a class="primary pdf-action" id="viewPdf" href="#" target="_blank" rel="noopener noreferrer" hidden>查看評核表</a>
      <button class="primary" id="againSame">繼續評核下一位學員</button>
    </div>
  </div>
</div>

<div class="footbar" id="footbar">
  <div class="footinner">
    <div class="stat">已完成 <b id="footNum">0/25</b> 題<br><span id="footHint">請完成全部評核項目</span></div>
    <button class="primary" id="submitBtn" disabled>送出評核</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 評核項目定義（依原始紙本評核表，共 25 題） ===== */
var SECTIONS = [
  {key:'hx',  name:'病史詢問', items:[
    {id:'A1', text:'是否有詢問症狀時間（duration）？'},
    {id:'A2', text:'是否有詢問加重因子及緩解因子？'},
    {id:'A3', text:'是否有做呼吸音的聽診？'}
  ]},
  {key:'emg', name:'緊急狀況處理', items:[
    {id:'B1', text:'是否有檢查病人意識？'},
    {id:'B2', text:'是否有呼叫求救？'},
    {id:'B3', text:'是否有檢查病人有無呼吸？'},
    {id:'B4', text:'是否有檢查病人脈搏？'}
  ]},
  {key:'int', name:'氣管內插管', items:[
    {id:'C1', text:'是否有給予 preoxygenation？'},
    {id:'C2', text:'是否有良好的準備插管工具？'},
    {id:'C3', text:'是否有將 cuff 打起來？'},
    {id:'C4', text:'是否有檢查插管位置（聽診順序對不對？）'}
  ]},
  {key:'ptx', name:'氣胸處理', items:[
    {id:'D1', text:'是否有發現氣胸（由理學檢查）？'},
    {id:'D2', text:'是否有發現氣胸（由胸部 X 光）？'},
    {id:'D3', text:'是否知道氣胸的處理？'}
  ]},
  {key:'shk', name:'休克處理', items:[
    {id:'E1', text:'是否有了解到病患為哪一種休克？'},
    {id:'E2', text:'是否有給予適合的處置？'}
  ]},
  {key:'tw',  name:'團隊合作表現', items:[
    {id:'F1', text:'團隊成員是否清楚本身之角色和任務？'},
    {id:'F2', text:'發現緊急異常事件時，是否有大聲通報（call-out）？'},
    {id:'F3', text:'團員接受任務時，是否有回覆確認（check-back）？'},
    {id:'F4', text:'團員是否回報任務進度？'},
    {id:'F5', text:'需要協助時，是否主動求援？'},
    {id:'F6', text:'團員是否有互相照應（cross monitoring）？'},
    {id:'F7', text:'如發現其他團員需要援助時，是否主動支援？'}
  ]},
  {key:'fam', name:'與家屬溝通互動', items:[
    {id:'G1', text:'是否有同理家屬感受與安撫其情緒？'},
    {id:'G2', text:'是否清楚說明病情與後續治療計畫？'}
  ]}
];

var TOTAL = SECTIONS.reduce(function(n,s){return n+s.items.length;},0);
var answers = {};
var submittedEvaluation = null;
var evaluationViewUrl = '';
var IS_GAS = (typeof google !== 'undefined' && google.script && google.script.run);

/* 這是您提供的最新 GAS 網址 */
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyLrYwiDKiz7Ti1fYjZzqa3sj2PnnpDdrsVtw7rEGEMthvUo-DKdxRVx8nD1GEOKIKI/exec'; 

/* 執行模式自動判斷：
   gas  = 直接由 Apps Script 網址開啟，用 google.script.run 寫入
   http = 放在外部主機，用 fetch POST 寫入 (透過您提供的網址)
   demo = 兩者皆無，僅供預覽 */
var MODE = IS_GAS ? 'gas' : (WEB_APP_URL ? 'http' : 'demo');

/* ===== 建立題目 ===== */
(function build(){
  var host = document.getElementById('sections');
  SECTIONS.forEach(function(sec){
    var card = document.createElement('section');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head"><span class="tag"></span><h2>'+sec.name+'</h2>'+
      '<span class="count" id="cnt_'+sec.key+'">0/'+sec.items.length+'</span></div>';

    sec.items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'item';
      row.id = 'row_'+it.id;
      row.innerHTML =
        '<div class="q"><span class="no">'+it.id+'</span>'+it.text+'</div>'+
        '<div class="seg">'+
          '<button type="button" data-id="'+it.id+'" data-v="有" aria-label="'+it.id+' 有">有</button>'+
          '<button type="button" data-id="'+it.id+'" data-v="沒有" aria-label="'+it.id+' 沒有">沒有</button>'+
        '</div>';
      card.appendChild(row);
    });

    var act = document.createElement('div');
    act.className = 'sec-actions';
    act.innerHTML = '<button type="button" class="linkbtn" data-all="'+sec.key+'">本構面全部勾「有」</button>';
    card.appendChild(act);
    host.appendChild(card);
  });

  host.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.id){ setAnswer(b.dataset.id, b.dataset.v); }
    else if(b.dataset.all){
      var sec = SECTIONS.filter(function(s){return s.key===b.dataset.all;})[0];
      sec.items.forEach(function(it){ setAnswer(it.id,'有'); });
      toast(sec.name+'：已全部設為「有」');
    }
  });
})();

function setAnswer(id, v){
  answers[id] = v;
  var row = document.getElementById('row_'+id);
  row.classList.remove('unanswered');
  row.querySelectorAll('.seg button').forEach(function(btn){
    btn.classList.remove('on-yes','on-no');
    if(btn.dataset.v === v) btn.classList.add(v==='有' ? 'on-yes' : 'on-no');
  });
  refresh();
}

function refresh(){
  var done = Object.keys(answers).length;
  document.getElementById('fill').style.width = (done/TOTAL*100)+'%';
  document.getElementById('meterNum').textContent = done+' / '+TOTAL;
  document.getElementById('footNum').textContent = done+'/'+TOTAL;
  SECTIONS.forEach(function(sec){
    var n = sec.items.filter(function(it){return answers[it.id];}).length;
    var el = document.getElementById('cnt_'+sec.key);
    el.textContent = n+'/'+sec.items.length;
    el.classList.toggle('done', n===sec.items.length);
  });
  var ok = done===TOTAL;
  document.getElementById('submitBtn').disabled = !ok;
  document.getElementById('footHint').textContent = ok ? '已可送出評核' : ('尚有 '+(TOTAL-done)+' 題未評');
}

/* ===== 工具 ===== */
var toastEl = document.getElementById('toast'), toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}
function val(id){ return document.getElementById(id).value.trim(); }

document.getElementById('f_date').value = new Date().toISOString().slice(0,10);

/* ===== 送出 ===== */
document.getElementById('submitBtn').addEventListener('click', function(){
  var required = [['f_date','評核日期'],['f_student','受評學員'],['f_teacher','指導教師']];
  for(var i=0;i<required.length;i++){
    if(!val(required[i][0])){
      toast('請填寫「'+required[i][1]+'」');
      var el = document.getElementById(required[i][0]);
      el.scrollIntoView({behavior:'smooth', block:'center'}); el.focus({preventScroll:true});
      return;
    }
  }
  var missing = [];
  SECTIONS.forEach(function(s){ s.items.forEach(function(it){ if(!answers[it.id]) missing.push(it.id); }); });
  if(missing.length){
    missing.forEach(function(id){ document.getElementById('row_'+id).classList.add('unanswered'); });
    document.getElementById('row_'+missing[0]).scrollIntoView({behavior:'smooth', block:'center'});
    toast('尚有 '+missing.length+' 題未評核');
    return;
  }

  var payload = {
    evalDate: val('f_date'),
    caseName: 'Pneumothorax with Respiratory Failure',
    student: val('f_student'),
    teacher: val('f_teacher'),
    strength: val('f_strength'),
    suggest: val('f_suggest'),
    answers: answers
  };
  // 保留送出當下的快照；後續清空表單也不會影響「查看評核表」內容。
  submittedEvaluation = JSON.parse(JSON.stringify(payload));

  document.getElementById('errBox').classList.remove('show');
  var btn = this;
  btn.disabled = true; btn.textContent = '送出中…';

  if(MODE==='gas'){
    google.script.run
      .withSuccessHandler(function(res){
        btn.textContent = '送出評核';
        if(res && res.ok){ 
            var resultData = localScore(payload);
            resultData.serial = res.serial || 'GAS-0001';
            resultData.pdfUrl = res.pdfUrl || '';
            showDone(resultData);
        }
        else { btn.disabled=false; showError((res&&res.message) || '伺服器沒有回應內容'); }
      })
      .withFailureHandler(function(err){
        btn.disabled = false; btn.textContent = '送出評核';
        showError((err && err.message ? err.message : '連線異常') +
          '｜若持續失敗，請至 Apps Script 重新部署新版本');
      })
      .submitEvaluation(payload);
  } else if(MODE==='http'){
    postToGas(payload, btn);
  } else {
    setTimeout(function(){ 
        btn.textContent='送出評核'; 
        var resultData = localScore(payload);
        resultData.serial = 'DEMO-預覽模式未存檔';
        showDone(resultData); 
    }, 500);
  }
});

/* 由外部主機送出：以 text/plain 送 JSON，避開 CORS 預檢 */
function postToGas(payload, btn){
  fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
    redirect:'follow'
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    btn.textContent='送出評核';
    if(res && res.ok){ 
        // 成功後整合本地計算成績與後端流水號，顯示完成畫面
        var resultData = localScore(payload);
        resultData.serial = res.serial || 'API-0001';
        resultData.pdfUrl = res.pdfUrl || '';
        showDone(resultData); 
    }
    else { btn.disabled=false; showError((res&&res.message) || '伺服器沒有回應內容'); }
  })
  .catch(function(){
    /* 讀不到回應時改用 no-cors 補送一次，資料仍會寫入，但拿不到回條 */
    fetch(WEB_APP_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    })
    .then(function(){
      btn.textContent='送出評核';
      var r = localScore(payload);
      r.serial = '已送出（請至試算表確認）';
      showDone(r);
    })
    .catch(function(e2){
      btn.disabled=false; btn.textContent='送出評核';
      showError('無法連線至資料庫：' + (e2.message||'請確認網路') +
        '｜也請確認 Apps Script 部署的存取權限設為「任何人」');
    });
  });
}

function localScore(p){
  var secs = SECTIONS.map(function(s){
    var y = s.items.filter(function(it){ return p.answers[it.id]==='有'; }).length;
    return {name:s.name, yes:y, total:s.items.length};
  });
  var yes = secs.reduce(function(n,s){ return n+s.yes; }, 0);
  return {ok:true, totalYes:yes, totalItems:TOTAL,
          percent:Math.round(yes/TOTAL*1000)/10, sections:secs,
          student:p.student, teacher:p.teacher};
}

function showError(msg){
  var box = document.getElementById('errBox');
  box.innerHTML = '<b>送出未成功</b><br>' + msg + '<br>你填寫的內容仍保留在畫面上，排除後可直接再按一次送出。';
  box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'center'});
  toast('送出未成功，請看上方紅色說明');
}

function showDone(res){
  document.getElementById('formScreen').style.display='none';
  document.getElementById('footbar').style.display='none';
  document.getElementById('doneScreen').classList.add('show');
  document.getElementById('doneMeta').textContent =
    res.student+'　|　'+res.teacher+'　|　編號 '+res.serial;
  document.getElementById('doneScore').textContent = res.totalYes;
  document.getElementById('donePct').textContent = '通過率 '+res.percent+'%';
  document.getElementById('doneBars').innerHTML = res.sections.map(function(s){
    var pct = Math.round(s.yes/s.total*100);
    return '<div class="brow"><div class="t"><span>'+s.name+'</span><b>'+s.yes+'/'+s.total+'</b></div>'+
           '<div class="track"><div class="val" style="width:'+pct+'%"></div></div></div>';
  }).join('');
  var pdfLink = document.getElementById('viewPdf');
  // 後端 PDF 網址可能因權限或跨網域而無法顯示；改以本次送出的完整資料
  // 建立唯讀評核表，確保老師能立即查看每一題與質性回饋。
  if(evaluationViewUrl) URL.revokeObjectURL(evaluationViewUrl);
  evaluationViewUrl = URL.createObjectURL(new Blob([buildEvaluationView(submittedEvaluation)], {type:'text/html;charset=utf-8'}));
  pdfLink.hidden = false;
  pdfLink.href = evaluationViewUrl;
  window.scrollTo({top:0, behavior:'auto'});
}

function escHtml(value){
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function buildEvaluationView(p){
  p = p || {};
  var savedAnswers = p.answers || {};
  var rows = SECTIONS.map(function(sec){
    var items = sec.items.map(function(it){
      var answer = savedAnswers[it.id] || '未填';
      var cls = answer === '有' ? 'yes' : (answer === '沒有' ? 'no' : '');
      return '<tr><td class="code">'+escHtml(it.id)+'</td><td>'+escHtml(it.text)+'</td><td class="answer '+cls+'">'+escHtml(answer)+'</td></tr>';
    }).join('');
    return '<h2>'+escHtml(sec.name)+'</h2><table><thead><tr><th>題號</th><th>評核項目</th><th>結果</th></tr></thead><tbody>'+items+'</tbody></table>';
  }).join('');
  var nl2br = function(value){ return escHtml(value || '無').replace(/\r?\n/g,'<br>'); };
  return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>西醫指導教師評核表</title><style>'+
    'body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;color:#1d2433;max-width:900px;margin:0 auto;padding:24px;background:#f5f7fa}'+
    '.sheet{background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0b1a3a18}h1{text-align:center;color:#0b1a3a;margin:0 0 6px}'+
    '.case{text-align:center;color:#6b7688;margin-bottom:22px}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;padding:14px;background:#f7f9fc;border-radius:10px}'+
    'h2{font-size:17px;color:#14275a;border-left:5px solid #f39220;padding-left:9px;margin-top:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dce2ec;padding:8px;text-align:left}th{background:#edf1f8}'+
    '.code{width:52px;color:#14275a;font-weight:700}.answer{width:72px;text-align:center;font-weight:800}.yes{color:#0e7c5a}.no{color:#b4472e}.feedback{white-space:normal;border:1px solid #dce2ec;background:#fafafa;padding:12px;min-height:40px}'+
    '.print{display:block;margin:0 auto 18px;padding:10px 20px;border:0;border-radius:9px;background:#0b1a3a;color:#fff;font-weight:700;cursor:pointer}@media print{body{padding:0;background:#fff}.sheet{box-shadow:none}.print{display:none}}@media(max-width:600px){body{padding:10px}.sheet{padding:16px}.info{grid-template-columns:1fr}}'+
    '</style></head><body><button class="print" onclick="window.print()">列印／另存 PDF</button><main class="sheet"><h1>PGY TRM 西醫指導教師評核表</h1>'+
    '<div class="case">情境教案：'+escHtml(p.caseName || '')+'</div><div class="info"><div><b>評核日期：</b>'+escHtml(p.evalDate || '')+'</div><div><b>受評學員：</b>'+escHtml(p.student || '')+'</div><div><b>指導教師：</b>'+escHtml(p.teacher || '')+'</div></div>'+
    rows+'<h2>質性回饋</h2><p><b>表現良好之處</b></p><div class="feedback">'+nl2br(p.strength)+'</div><p><b>建議改善事項</b></p><div class="feedback">'+nl2br(p.suggest)+'</div></main></body></html>';
}

function resetForm(){
  answers = {};
  document.querySelectorAll('.seg button').forEach(function(b){ b.classList.remove('on-yes','on-no'); });
  document.querySelectorAll('.item').forEach(function(r){ r.classList.remove('unanswered'); });
  ['f_strength','f_suggest'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('f_student').value = 'PGY2';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '送出評核';
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('formScreen').style.display='';
  document.getElementById('footbar').style.display='';
  refresh(); window.scrollTo({top:0});
}
document.getElementById('againSame').addEventListener('click', function(){ resetForm(); toast('已保留指導教師，可評下一位'); });

if(MODE==='demo'){ document.getElementById('demoNote').classList.add('show'); }
refresh();
</script>
